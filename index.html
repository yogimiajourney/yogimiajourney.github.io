<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Journey ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#ffd6e7,#ffeccf);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    text-align:center;
    max-width:500px;
}

h1{
    color:#ff4d6d;
    margin-bottom:15px;
}

p{
    color:#555;
    margin-bottom:25px;
    line-height:1.6;
}

button{
    background:#ff4d6d;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:50px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#e6395f;
}
</style>

</head>
<body>

<div class="card">
<h1>❤️ Welcome to Our Journey ❤️</h1>

<p>
Tempat untuk menyimpan semua rencana, impian,
dan kenangan yang akan kita wujudkan bersama.
</p>

<button onclick="alert('Perjalanan kita baru dimulai ❤️')">
Klik Aku
</button>

</div>

</body>
</html>
