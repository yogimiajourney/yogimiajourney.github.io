<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Journey 💖 Yogi & Mia</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-pink: #e8b4b8;
            --accent-pink-glow: rgba(232, 180, 184, 0.3);
            --accent-green: #34d399;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(232, 180, 184, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            padding-bottom: 50px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px 0;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            color: var(--accent-pink);
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-pink);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Form Inputs */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"], input[type="date"], select, textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-pink);
            box-shadow: 0 0 10px var(--accent-pink-glow);
        }

        .btn {
            background: var(--accent-pink);
            color: #0f172a;
            font-weight: 600;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* Filter Buttons */
        .filter-container {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-btn {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: var(--accent-pink);
            color: #0f172a;
            font-weight: 600;
            border-color: var(--accent-pink);
        }

        /* WACANA SECTION */
        .wacana-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .wacana-item {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .wacana-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .wacana-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .wacana-checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--accent-pink);
            cursor: pointer;
        }

        .wacana-text {
            font-size: 0.95rem;
        }

        .wacana-text.done {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .date-badge {
            font-size: 0.75rem;
            background: rgba(52, 211, 153, 0.15);
            color: var(--accent-green);
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        .wacana-date-picker {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 4px;
            padding-top: 8px;
            border-top: 1px dashed rgba(255, 255, 255, 0.05);
        }

        .wacana-date-picker input[type="date"] {
            padding: 4px 8px;
            font-size: 0.8rem;
            width: auto;
        }

        /* DREAM PLACES SECTION */
        .place-item {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .place-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .place-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .place-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-maps {
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
            padding: 5px 10px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-delete {
            color: #f87171;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 5px;
        }

        /* GALERI FOTO SECTION */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .photo-card {
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            background: #1e293b;
            border: 1px solid var(--card-border);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .photo-card:hover img {
            transform: scale(1.05);
        }

        .photo-badge-cat {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 6px;
            color: var(--accent-pink);
        }

        /* MODAL / LIGHTBOX ZOOM FOTO */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(10px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 90%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 65vh;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            object-fit: contain;
        }

        .modal-info {
            text-align: center;
            color: var(--text-main);
        }

        .modal-caption {
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .modal-meta {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--text-main);
            font-size: 1.8rem;
            cursor: pointer;
        }

        /* Custom File Input */
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-input-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed var(--accent-pink);
            color: var(--accent-pink);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Yogi & Mia</h1>
            <p>Jurnal Wacana, Impian & Kenangan 💖</p>
        </header>

        <!-- SECTION 1: WACANA -->
        <div class="card">
            <div class="card-title">
                <i class="fa-solid fa-list-check"></i> Daftar Wacana
            </div>

            <div class="input-group">
                <div class="input-row">
                    <input type="text" id="wacanaInput" placeholder="Tambah wacana baru...">
                    <button class="btn" onclick="addWacana()"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

            <!-- Filter Status Wacana -->
            <div class="filter-container">
                <button class="filter-btn active" onclick="filterWacana('all', this)">Semua</button>
                <button class="filter-btn" onclick="filterWacana('pending', this)">Belum Terwujud</button>
                <button class="filter-btn" onclick="filterWacana('done', this)">Sudah Terwujud 🚩</button>
            </div>

            <div class="wacana-list" id="wacanaList"></div>
        </div>

        <!-- SECTION 2: DREAM PLACES -->
        <div class="card">
            <div class="card-title">
                <i class="fa-solid fa-compass"></i> Tempat Impian
            </div>

            <div class="input-group">
                <div class="input-row">
                    <input type="text" id="placeInput" placeholder="Nama tempat impian...">
                    <button class="btn" onclick="addPlace()"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

            <div id="placeList"></div>
        </div>

        <!-- SECTION 3: GALERI FOTO -->
        <div class="card">
            <div class="card-title">
                <i class="fa-solid fa-images"></i> Galeri Kenangan
            </div>

            <!-- Input Unggah Foto -->
            <div class="input-group">
                <div class="file-input-wrapper">
                    <div class="file-input-btn" id="fileLabel">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Pilih Foto
                    </div>
                    <input type="file" id="photoInput" accept="image/*" onchange="updateFileName()">
                </div>
                
                <input type="text" id="photoCaption" placeholder="Catatan/Caption foto (Opsional)">
                
                <div class="input-row">
                    <select id="photoCategory">
                        <option value="Berdua">👩‍❤️‍👨 Berdua</option>
                        <option value="Kuliner">🍕 Kuliner</option>
                        <option value="Jalan-Jalan">✈️ Jalan-Jalan</option>
                        <option value="Random">✨ Random</option>
                    </select>
                    <input type="date" id="photoDate" title="Tanggal Foto (Opsional)">
                </div>

                <button class="btn" onclick="uploadPhoto()"><i class="fa-solid fa-upload"></i> Simpan Foto</button>
            </div>

            <!-- Filter Kategori Foto -->
            <div class="filter-container" id="photoFilterContainer">
                <!-- Diisi otomatis oleh JS -->
            </div>

            <!-- Grid Thumbnail Foto -->
            <div class="photo-grid" id="photoGrid"></div>
        </div>
    </div>

    <!-- MODAL ZOOM FOTO -->
    <div class="modal" id="photoModal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <div class="modal-content" onclick="event.stopPropagation()">
            <img id="modalImg" src="" alt="Zoom Foto">
            <div class="modal-info">
                <div class="modal-caption" id="modalCaption"></div>
                <div class="modal-meta" id="modalMeta"></div>
            </div>
        </div>
    </div>

    <script>
        // --- DATA STORE ---
        let wacanas = JSON.parse(localStorage.getItem('ym_wacanas')) || [];
        let places = JSON.parse(localStorage.getItem('ym_places')) || [];
        let photos = JSON.parse(localStorage.getItem('ym_photos')) || [];

        let currentWacanaFilter = 'all';
        let currentPhotoCategory = 'Semua';

        // --- INIT ---
        window.onload = () => {
            renderWacana();
            renderPlaces();
            renderPhotoFilters();
            renderPhotos();
        };

        // --- 1. LOGIK WACANA ---
        function addWacana() {
            const input = document.getElementById('wacanaInput');
            if (!input.value.trim()) return;

            wacanas.push({
                id: Date.now(),
                text: input.value.trim(),
                done: false,
                dateDone: ''
            });

            input.value = '';
            saveWacana();
        }

        function toggleWacana(id) {
            const item = wacanas.find(w => w.id === id);
            if (item) {
                item.done = !item.done;
                if (!item.done) item.dateDone = ''; // Reset tanggal jika uncheck
                saveWacana();
            }
        }

        function updateWacanaDate(id, dateVal) {
            const item = wacanas.find(w => w.id === id);
            if (item) {
                item.dateDone = dateVal;
                saveWacana();
            }
        }

        function deleteWacana(id) {
            wacanas = wacanas.filter(w => w.id !== id);
            saveWacana();
        }

        function filterWacana(filter, btn) {
            currentWacanaFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => {
                if (b.parentElement.id !== 'photoFilterContainer') b.classList.remove('active');
            });
            btn.classList.add('active');
            renderWacana();
        }

        function saveWacana() {
            localStorage.setItem('ym_wacanas', JSON.stringify(wacanas));
            renderWacana();
        }

        function renderWacana() {
            const list = document.getElementById('wacanaList');
            list.innerHTML = '';

            let filtered = wacanas;
            if (currentWacanaFilter === 'pending') filtered = wacanas.filter(w => !w.done);
            if (currentWacanaFilter === 'done') filtered = wacanas.filter(w => w.done);

            filtered.forEach(w => {
                const el = document.createElement('div');
                el.className = 'wacana-item';
                
                let datePickerHTML = '';
                if (w.done) {
                    datePickerHTML = `
                        <div class="wacana-date-picker">
                            <span>📅 Terwujud pada:</span>
                            <input type="date" value="${w.dateDone || ''}" onchange="updateWacanaDate(${w.id}, this.value)">
                        </div>
                    `;
                }

                el.innerHTML = `
                    <div class="wacana-main">
                        <div class="wacana-left">
                            <input type="checkbox" class="wacana-checkbox" ${w.done ? 'checked' : ''} onchange="toggleWacana(${w.id})">
                            <span class="wacana-text ${w.done ? 'done' : ''}">${w.text}</span>
                        </div>
                        <button class="btn-delete" onclick="deleteWacana(${w.id})"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    ${datePickerHTML}
                `;
                list.appendChild(el);
            });
        }

        // --- 2. LOGIK DREAM PLACES ---
        function addPlace() {
            const input = document.getElementById('placeInput');
            if (!input.value.trim()) return;

            places.push({
                id: Date.now(),
                name: input.value.trim(),
                visited: false,
                dateVisited: ''
            });

            input.value = '';
            savePlaces();
        }

        function togglePlaceVisited(id) {
            const item = places.find(p => p.id === id);
            if (item) {
                item.visited = !item.visited;
                if (!item.visited) item.dateVisited = '';
                savePlaces();
            }
        }

        function updatePlaceDate(id, dateVal) {
            const item = places.find(p => p.id === id);
            if (item) {
                item.dateVisited = dateVal;
                savePlaces();
            }
        }

        function deletePlace(id) {
            places = places.filter(p => p.id !== id);
            savePlaces();
        }

        function savePlaces() {
            localStorage.setItem('ym_places', JSON.stringify(places));
            renderPlaces();
        }

        function renderPlaces() {
            const list = document.getElementById('placeList');
            list.innerHTML = '';

            places.forEach(p => {
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}`;
                const el = document.createElement('div');
                el.className = 'place-item';

                let visitedDateHTML = '';
                if (p.visited) {
                    visitedDateHTML = `
                        <div class="wacana-date-picker">
                            <span>🚩 Dikunjungi pada:</span>
                            <input type="date" value="${p.dateVisited || ''}" onchange="updatePlaceDate(${p.id}, this.value)">
                        </div>
                    `;
                }

                el.innerHTML = `
                    <div class="place-header">
                        <div class="place-title">
                            <input type="checkbox" class="wacana-checkbox" ${p.visited ? 'checked' : ''} onchange="togglePlaceVisited(${p.id})">
                            <span class="${p.visited ? 'done' : ''}">${p.name}</span>
                        </div>
                        <div class="place-actions">
                            <a href="${mapsUrl}" target="_blank" class="btn-maps"><i class="fa-solid fa-location-dot"></i> Maps</a>
                            <button class="btn-delete" onclick="deletePlace(${p.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    ${visitedDateHTML}
                `;
                list.appendChild(el);
            });
        }

        // --- 3. LOGIK GALERI FOTO (THUMBNAIL OPTIMIZED) ---
        function updateFileName() {
            const fileInput = document.getElementById('photoInput');
            const fileLabel = document.getElementById('fileLabel');
            if (fileInput.files.length > 0) {
                fileLabel.innerHTML = `<i class="fa-solid fa-check"></i> ${fileInput.files[0].name}`;
            }
        }

        // Fungsi Kompresi Foto (Trik Thumbnail Kecil Bebas Lag)
        function compressImage(file, maxWidth, quality, callback) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    callback(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function uploadPhoto() {
            const fileInput = document.getElementById('photoInput');
            const captionInput = document.getElementById('photoCaption');
            const categoryInput = document.getElementById('photoCategory');
            const dateInput = document.getElementById('photoDate');

            if (fileInput.files.length === 0) {
                alert('Pilih foto terlebih dahulu ya!');
                return;
            }

            const file = fileInput.files[0];

            // 1. Buat versi Thumbnail Kecil (Lebar 300px) untuk Grid
            compressImage(file, 300, 0.6, (thumbDataUrl) => {
                // 2. Buat versi Full/Zoom (Lebar 1000px) untuk Modal
                compressImage(file, 1000, 0.8, (fullDataUrl) => {
                    photos.push({
                        id: Date.now(),
                        thumbSrc: thumbDataUrl,
                        fullSrc: fullDataUrl,
                        caption: captionInput.value.trim(),
                        category: categoryInput.value,
                        date: dateInput.value || ''
                    });

                    // Reset Input
                    fileInput.value = '';
                    captionInput.value = '';
                    dateInput.value = '';
                    document.getElementById('fileLabel').innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Pilih Foto`;

                    savePhotos();
                });
            });
        }

        function deletePhoto(id) {
            photos = photos.filter(p => p.id !== id);
            savePhotos();
            closeModal();
        }

        function savePhotos() {
            try {
                localStorage.setItem('ym_photos', JSON.stringify(photos));
            } catch (e) {
                alert('Memori HP penuh! Coba hapus beberapa foto lama ya.');
            }
            renderPhotoFilters();
            renderPhotos();
        }

        function renderPhotoFilters() {
            const container = document.getElementById('photoFilterContainer');
            const categories = ['Semua', 'Berdua', 'Kuliner', 'Jalan-Jalan', 'Random'];

            container.innerHTML = categories.map(cat => {
                const count = cat === 'Semua' ? photos.length : photos.filter(p => p.category === cat).length;
                const activeClass = currentPhotoCategory === cat ? 'active' : '';
                return `<button class="filter-btn ${activeClass}" onclick="filterPhotoCat('${cat}')">${cat} (${count})</button>`;
            }).join('');
        }

        function filterPhotoCat(cat) {
            currentPhotoCategory = cat;
            renderPhotoFilters();
            renderPhotos();
        }

        function renderPhotos() {
            const grid = document.getElementById('photoGrid');
            grid.innerHTML = '';

            let filtered = photos;
            if (currentPhotoCategory !== 'Semua') {
                filtered = photos.filter(p => p.category === currentPhotoCategory);
            }

            filtered.forEach(p => {
                const el = document.createElement('div');
                el.className = 'photo-card';
                el.onclick = () => openModal(p);

                el.innerHTML = `
                    <span class="photo-badge-cat">${p.category}</span>
                    <img src="${p.thumbSrc}" alt="Thumbnail" loading="lazy">
                `;
                grid.appendChild(el);
            });
        }

        // --- 4. LIGHTBOX ZOOM MODAL ---
        function openModal(photo) {
            const modal = document.getElementById('photoModal');
            const modalImg = document.getElementById('modalImg');
            const modalCaption = document.getElementById('modalCaption');
            const modalMeta = document.getElementById('modalMeta');

            modalImg.src = photo.fullSrc; // Muat gambar versi jelas
            modalCaption.innerText = photo.caption || 'Tanpa catatan';
            
            let dateText = photo.date ? `📅 ${photo.date}` : '';
            modalMeta.innerHTML = `
                ${dateText} | Kategori: <b>${photo.category}</b>
                <br><br>
                <button class="btn-delete" style="font-size: 0.9rem;" onclick="deletePhoto(${photo.id})">
                    <i class="fa-solid fa-trash"></i> Hapus Foto Ini
                </button>
            `;

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('photoModal').classList.remove('active');
        }
    </script>
</body>
</html>
